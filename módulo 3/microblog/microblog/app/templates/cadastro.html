{% extends "base.html" %}

{% block title %}Cadastro - Microblog{% endblock %}

{% block content %}

<h1>Cadastro</h1>

<form method="POST" action="{{ url_for('cadastro') }}" class="form">
    <label for="username">Usuário</label>
    <input type="text" name="username" id="username" required autofocus>

    <label for="email">E-mail</label>
    <input type="email" name="email" id="email" required>

    <label for="password">Senha</label>
    <input type="password" name="password" id="password" required>

    <label for="foto">URL da foto de perfil</label>
    <input type="url" name="foto" id="foto"
           placeholder="https://exemplo.com/minha-foto.jpg">

    <label for="bio">Bio</label>
    <textarea name="bio" id="bio" rows="3" maxlength="500"
              placeholder="Fale um pouco sobre você"></textarea>

    <button type="submit" class="btn btn-primario">Cadastrar</button>
</form>

<p class="link-secundario">
    Já tem conta? <a href="{{ url_for('login') }}">Faça login</a>.
</p>

{% endblock %}
